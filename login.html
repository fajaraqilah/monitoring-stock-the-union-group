<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>
    <!-- Tailwind CSS (Production) -->
    <link href="./public/css/style.css" rel="stylesheet">

    <style>
        .login-container {
            min-height: 100vh;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="login-container flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <div class="text-center mb-8">
                <!-- Logo -->
                <img src="./public/assets/UnionGroupLogo.png" alt="Union Group Logo" class="mx-auto mb-4 h-16 w-auto">
                <h1 class="text-2xl font-bold text-gray-800">Inventory Management System</h1>
                <p class="text-gray-600 mt-2">Sign in to your account</p>
            </div>

            <!-- Loading Spinner -->
            <div id="loading-spinner"
                class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
                <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="you@example.com">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="••••••••">
                </div>

                <div class="mb-4">
                    <button type="submit" id="login-btn"
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Sign In
                    </button>
                </div>

                <div id="error-message" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-md"></div>
            </form>
        </div>
    </div>

    <!-- Include JavaScript modules -->
    <script type="module">
        import { auth } from './public/js/auth.js';

        // Initialize login page
        document.addEventListener('DOMContentLoaded', function () {
            // Check if already authenticated
            checkAuthStatus();

            // Setup form submission
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        });

        // Check if user is already authenticated
        async function checkAuthStatus() {
            try {
                const isAuthenticated = await auth.isAuthenticated();
                if (isAuthenticated) {
                    // Redirect to dashboard if already logged in
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
            }
        }

        // Handle login form submission
        async function handleLogin(event) {
            event.preventDefault();

            // Get form values
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validate inputs
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            try {
                // Show loading spinner
                document.getElementById('loading-spinner').classList.remove('hidden');
                document.getElementById('login-btn').disabled = true;

                // Attempt login
                await auth.login(email, password);

                // Redirect to dashboard on success
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Invalid email or password. Please try again.');
            } finally {
                // Hide loading spinner
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('login-btn').disabled = false;
            }
        }

        // Show error message
        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');

            // Hide error after 5 seconds
            setTimeout(() => {
                errorElement.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>

</html>
